<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Daily Trading Review</title>
  <style>
    :root{
      --bg:#eef3fb;
      --card:#ffffff;
      --text:#1c2434;
      --muted:#5f6e86;
      --line:#d7e1f2;
      --primary:#1e63d9;
      --primary-dark:#174fb0;
      --ok:#0a7f44;
      --err:#b42318;
      --section-top:#eef5ff;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:"Segoe UI",Tahoma,sans-serif;
      background:
        radial-gradient(900px 420px at -10% -10%, #dbe8ff 0%, transparent 60%),
        radial-gradient(700px 360px at 110% 0%, #d9f0ff 0%, transparent 58%),
        var(--bg);
      color:var(--text);
    }

    .container{
      max-width:920px;
      margin:0 auto;
      padding:18px 14px 40px;
    }

    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:14px;
      padding:16px;
      box-shadow:0 16px 34px rgba(26,46,87,.10);
    }

    h1{
      margin:0 0 4px;
      font-size:clamp(22px,3vw,32px);
    }

    .sub{
      margin:0 0 16px;
      color:var(--muted);
      font-size:14px;
    }

    .section{
      border:1px solid var(--line);
      border-radius:12px;
      padding:12px;
      margin-bottom:12px;
      background:linear-gradient(180deg,var(--section-top),#ffffff 24%);
    }

    .section h2{
      margin:0 0 10px;
      font-size:14px;
      text-transform:uppercase;
      letter-spacing:.06em;
      color:#1f4f97;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr;
      gap:10px;
    }

    @media (min-width:680px){
      .grid.two{grid-template-columns:1fr 1fr}
      .grid.three{grid-template-columns:1fr 1fr 1fr}
    }

    label{
      display:block;
      margin:0 0 6px;
      font-size:13px;
      color:#334155;
    }

    input, select, textarea{
      width:100%;
      min-height:42px;
      border:1px solid #c5d3ea;
      border-radius:10px;
      padding:10px 12px;
      font-size:15px;
      background:#fdfefe;
      color:#111827;
    }

    textarea{min-height:100px;resize:vertical}

    input:focus, select:focus, textarea:focus{
      outline:none;
      border-color:var(--primary);
      box-shadow:0 0 0 3px rgba(37,99,235,.12);
    }

    .chips{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }

    .chip{
      display:inline-flex;
      gap:8px;
      align-items:center;
      border:1px solid #bfd1ee;
      border-radius:999px;
      min-height:38px;
      padding:6px 12px;
      cursor:pointer;
      background:#f6f9ff;
    }

    .chip input{
      width:auto;
      min-height:auto;
      padding:0;
      margin:0;
    }

    .actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:4px;
    }

    button{
      min-height:42px;
      border-radius:10px;
      padding:10px 16px;
      font-weight:700;
      font-size:15px;
      cursor:pointer;
    }

    .primary{
      border:0;
      background:var(--primary);
      color:#fff;
    }
    .primary:hover{background:var(--primary-dark)}

    .ghost{
      border:1px solid #b9ccea;
      background:#f2f7ff;
      color:#153a7a;
    }

    .status{
      margin-top:10px;
      font-size:13px;
      color:var(--muted);
    }
    .status.ok{color:var(--ok)}
    .status.err{color:var(--err)}

    .hidden{display:none}
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Daily Trading Review</h1>
      <p class="sub">Simple form layout for mobile, tablet, and desktop.</p>

      <form id="tradeForm" autocomplete="off">
        <section class="section">
          <h2>Day and Date</h2>
          <div class="grid two">
            <div>
              <label for="date">Date</label>
              <input id="date" name="Date" type="date" required />
            </div>
            <div>
              <label for="day">Day</label>
              <input id="day" name="Day" type="text" readonly />
            </div>
          </div>
        </section>

        <section class="section">
          <h2>Setup</h2>
          <div class="grid two">
            <div>
              <label for="openingBalance">Opening Balance</label>
              <input id="openingBalance" name="Opening Balance" type="number" step="0.01" required />
            </div>
            <div>
              <label for="closingBalance">Closing Balance</label>
              <input id="closingBalance" name="Closing Balance" type="number" step="0.01" required />
            </div>
          </div>
          <div class="grid two">
            <div>
              <label for="sleep">Sleep</label>
              <input id="sleep" name="Sleep" type="text" required />
            </div>
            <div>
              <label for="exercise">Exercise</label>
              <select id="exercise" name="Exercise" required>
                <option value="" selected disabled>Select</option>
                <option>Yes</option>
                <option>No</option>
              </select>
            </div>
          </div>
          <div>
            <label for="medication">Medication</label>
            <input id="medication" name="Medication" type="text" />
          </div>
        </section>

        <section class="section">
          <h2>Session</h2>
          <div>
            <label for="session">Choose Session</label>
            <select id="session" name="Session" required>
              <option value="" selected disabled>Select session</option>
              <option>Morning</option>
              <option>Noon</option>
              <option>Evening</option>
            </select>
          </div>
        </section>

        <section class="section hidden" id="morningBlock">
          <h2>Morning Check</h2>
          <div class="grid two">
            <div>
              <label for="mood">Mood (1-5)</label>
              <input id="mood" name="Mood (1-5)" type="number" min="1" max="5" />
            </div>
            <div>
              <label for="energy">Energy (1-5)</label>
              <input id="energy" name="Energy (1-5)" type="number" min="1" max="5" />
            </div>
          </div>
        </section>

        <section class="section">
          <h2>Trade</h2>
          <div class="grid two">
            <div>
              <label for="tradeNo">Trade No</label>
              <input id="tradeNo" name="Trade No" type="number" min="0" step="1" required />
            </div>
            <div>
              <label for="script">Script</label>
              <input id="script" name="Script" type="text" required />
            </div>
          </div>
          <div class="grid two">
            <div>
              <label for="entryReason">Reason for Entry</label>
              <textarea id="entryReason" name="Reason for Entry" required></textarea>
            </div>
            <div>
              <label for="exitReason">Reason to Exit</label>
              <textarea id="exitReason" name="Reason to Exit" required></textarea>
            </div>
          </div>
        </section>

        <section class="section">
          <h2>Result</h2>
          <div>
            <label>Averaging (Y/N)</label>
            <div class="chips">
              <label class="chip"><input type="radio" name="Averaging" value="Yes" required /> Yes</label>
              <label class="chip"><input type="radio" name="Averaging" value="No" required /> No</label>
            </div>
          </div>
          <div class="grid two">
            <div>
              <label for="pl">P/L</label>
              <input id="pl" name="P/L" type="number" step="0.01" required />
            </div>
            <div>
              <label for="notes">Notes</label>
              <input id="notes" name="Notes" type="text" />
            </div>
          </div>
        </section>

        <section class="section">
          <h2>Discipline</h2>
          <div class="grid two">
            <div>
              <label>Overtrading</label>
              <div class="chips">
                <label class="chip"><input type="radio" name="Overtrading" value="Yes" required /> Yes</label>
                <label class="chip"><input type="radio" name="Overtrading" value="No" required /> No</label>
              </div>
            </div>
            <div>
              <label>Fixed Position Size</label>
              <div class="chips">
                <label class="chip"><input type="radio" name="Fixed Position Size" value="Yes" required /> Yes</label>
                <label class="chip"><input type="radio" name="Fixed Position Size" value="No" required /> No</label>
              </div>
            </div>
          </div>
        </section>

        <div class="actions">
          <button class="primary" type="submit" id="submitBtn">Submit</button>
          <button class="ghost" type="button" id="resetBtn">Reset</button>
        </div>
        <div id="status" class="status"></div>
      </form>
    </div>
  </div>

  <script>
    const GOOGLE_SHEETS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxbJD-PcJZaG2xT2TZ48Bz-a2ecHvcbQWglyLRGCjTswrGFybvPcdzpgGApwrNU1MB0/exec";
    const FIELD_ORDER = [
      "Date",
      "Day",
      "Opening Balance",
      "Closing Balance",
      "Sleep",
      "Exercise",
      "Medication",
      "Session",
      "Mood (1-5)",
      "Energy (1-5)",
      "Trade No",
      "Script",
      "Reason for Entry",
      "Reason to Exit",
      "Averaging",
      "P/L",
      "Notes",
      "Overtrading",
      "Fixed Position Size"
    ];

    const form = document.getElementById("tradeForm");
    const dateEl = document.getElementById("date");
    const dayEl = document.getElementById("day");
    const sessionEl = document.getElementById("session");
    const morningBlock = document.getElementById("morningBlock");
    const moodEl = document.getElementById("mood");
    const energyEl = document.getElementById("energy");
    const submitBtn = document.getElementById("submitBtn");
    const resetBtn = document.getElementById("resetBtn");
    const statusEl = document.getElementById("status");

    function setStatus(msg, type){
      statusEl.textContent = msg || "";
      statusEl.className = "status" + (type ? " " + type : "");
    }

    function updateDayFromDate(){
      if (!dateEl.value){
        dayEl.value = "";
        return;
      }
      const dt = new Date(dateEl.value + "T00:00:00");
      dayEl.value = dt.toLocaleDateString(undefined, { weekday: "long" });
    }

    function updateMorningBlock(){
      const isMorning = sessionEl.value === "Morning";
      morningBlock.classList.toggle("hidden", !isMorning);
      moodEl.required = isMorning;
      energyEl.required = isMorning;
      if (!isMorning){
        moodEl.value = "";
        energyEl.value = "";
      }
    }

    dateEl.addEventListener("change", updateDayFromDate);
    sessionEl.addEventListener("change", updateMorningBlock);

    resetBtn.addEventListener("click", () => {
      form.reset();
      updateDayFromDate();
      updateMorningBlock();
      setStatus("");
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      setStatus("");
      updateDayFromDate();
      updateMorningBlock();

      const fd = new FormData(form);
      const payload = {};
      FIELD_ORDER.forEach((key) => {
        payload[key] = fd.get(key) ?? "";
      });
      payload.ClientTimestamp = new Date().toISOString();

      try {
        submitBtn.disabled = true;
        setStatus("Submitting...");

        if (!GOOGLE_SHEETS_WEBAPP_URL){
          setStatus("Submitted in test mode (no sheet URL).", "ok");
          return;
        }

        const res = await fetch(GOOGLE_SHEETS_WEBAPP_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });

        if (!res.ok) throw new Error("Failed with status " + res.status);

        const out = await res.json().catch(() => ({}));
        if (out.ok === false) throw new Error(out.message || "Server rejected request");

        setStatus(out.message || "Submitted successfully.", "ok");
        form.reset();
        updateDayFromDate();
        updateMorningBlock();
        window.scrollTo({ top: 0, behavior: "smooth" });
      } catch (err) {
        setStatus("Submit failed: " + (err && err.message ? err.message : String(err)), "err");
      } finally {
        submitBtn.disabled = false;
      }
    });

    updateDayFromDate();
    updateMorningBlock();
  </script>
</body>
</html>
